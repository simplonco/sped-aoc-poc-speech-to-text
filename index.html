<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictaphone – Whisper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Dictaphone</h1>
    <p class="subtitle">Whisper dans le navigateur (100 % local)</p>

    <button id="record-btn" type="button">Enregistrer</button>
    <p id="status" aria-live="polite"></p>

    <figure id="sample">
      <figcaption>Texte à lire</figcaption>
      <blockquote>Ce matin, mon chat Gustave a commandé trois pizzas aux anchois sur mon téléphone. Le livreur est arrivé à 7 h 30, et Gustave a payé avec mes croquettes. Depuis, la pizzeria refuse de me répondre.</blockquote>
    </figure>

    <section id="transcript" aria-live="polite"></section>

    <p id="settings"></p>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
